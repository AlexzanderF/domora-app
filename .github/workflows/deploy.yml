name: Deploy to Contabo VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Run Quality Checks & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification checks
        run: npm run check

      - name: Test production build
        run: npm run build

  deploy:
    name: Deploy to Contabo VPS
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'domora_user' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'domora' }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_PORT || 22 }}
          envs: DATABASE_URL,POSTGRES_PASSWORD,POSTGRES_USER,POSTGRES_DB,APP_DOMAIN
          script: |
            set -e
            cd /opt/domora-app

            # Fetch and align with latest commit
            git fetch origin main
            git reset --hard origin/main

            # Ensure DATABASE_URL is properly formed with user and password
            POSTGRES_USER="${POSTGRES_USER:-domora_user}"
            POSTGRES_DB="${POSTGRES_DB:-domora}"
            if [[ -z "$DATABASE_URL" || "$DATABASE_URL" != *":${POSTGRES_PASSWORD}@"* ]]; then
              DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
            fi

            # Ensure APP_DOMAIN is valid (default to :80 HTTP if empty or raw IP)
            APP_DOMAIN="${APP_DOMAIN:-:80}"
            if [[ "$APP_DOMAIN" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              APP_DOMAIN="http://${APP_DOMAIN}"
            fi

            # Automatically write .env from GitHub Secrets
            cat <<EOF > .env
            DATABASE_URL=${DATABASE_URL}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_DB=${POSTGRES_DB}
            APP_DOMAIN=${APP_DOMAIN}
            EOF

            # Build and launch containers
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # Run database migrations inside the running app container
            docker compose -f docker-compose.prod.yml exec -T app npm run db:migrate

name: CI
# Runs on pull requests, and is called by deploy.yml for pushes to main so that
# CI, image build and deploy form one workflow chain.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: domora_test
          POSTGRES_PASSWORD: domora_test
          POSTGRES_DB: domora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domora_test -d domora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://domora_test:domora_test@localhost:5432/domora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:db:run
      - run: npm run build
      # e2e tests temporarily ignored in CI
      # - run: npx playwright install --with-deps chromium
      # - run: npm run test:e2e

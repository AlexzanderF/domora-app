name: CI
# Runs on pull requests, and is called by deploy.yml for pushes to main so that
# CI, image build and deploy form one workflow chain.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # e2e tests temporarily ignored in CI
      # - run: npx playwright install --with-deps chromium
      # - run: npm run test:e2e
